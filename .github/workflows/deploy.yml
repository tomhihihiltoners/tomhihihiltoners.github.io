name: Build and Deploy Vite Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Add custom domain
        run: echo "dmitriicreativit.space" > dist/CNAME

      - name: Verify build output
        run: |
          test -f dist/index.html
          if grep -qE 'src="/src/.*\.jsx|src="/src/.*\.tsx' dist/index.html; then
            echo "ERROR: index.html references source JSX/TSX instead of built assets"
            exit 1
          fi
          echo "Build output looks correct"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
